<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root { --brand: #0B67D8; }
  body { background: #f4f6fb; font-family: 'Segoe UI', Arial, sans-serif; }
  .navbar-brand { font-weight: 700; }
  .brand-bg { background: var(--brand); }
  .card { border: none; box-shadow: 0 2px 14px rgba(20,40,80,.06); border-radius: 14px; }
  .card-header { background: #fff; border-bottom: 1px solid #eef1f6; font-weight: 600; border-radius: 14px 14px 0 0; }
  .saldo-box { background: linear-gradient(120deg, #0B67D8, #0a52ad); color: #fff; border-radius: 14px; }
  .saldo-box .lbl { opacity: .85; font-size: .85rem; }
  .saldo-box .amt { font-size: 1.7rem; font-weight: 700; }
  .badge-masuk { background: #e7f6ee; color: #16a34a; }
  .badge-keluar { background: #fdeaea; color: #d33; }
  .table td, .table th { vertical-align: middle; }
  .amt-in { color: #16a34a; font-weight: 600; }
  .amt-out { color: #1a1a1a; font-weight: 600; }
  .saldo-col { color: #0056b3; font-weight: 600; }
  .logo-preview { max-height: 60px; border: 1px solid #eee; border-radius: 8px; padding: 4px; background: #fff; }
  .btn-brand { background: var(--brand); color: #fff; }
  .btn-brand:hover { background: #0a58bd; color: #fff; }
  #toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 1080; }
</style>
</head>
<body>

<nav class="navbar brand-bg navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0"><i class="bi bi-wallet2 me-2"></i>Pencatatan Kas &amp; E-Statement</span>
  </div>
</nav>

<div id="toast-wrap"></div>

<div class="container pb-5">
  <div class="row g-4">

    <!-- KOLOM KIRI: INPUT + EXPORT + SETTINGS -->
    <div class="col-lg-5">

      <!-- Saldo saat ini -->
      <div class="saldo-box p-4 mb-4">
        <div class="lbl">Saldo Saat Ini</div>
        <div class="amt">IDR <span id="saldoNow">0,00</span></div>
      </div>

      <!-- Form Input -->
      <div class="card mb-4">
        <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Tambah Transaksi</div>
        <div class="card-body">
          <form id="formTrx">
            <div class="mb-3">
              <label class="form-label">Tanggal &amp; Waktu</label>
              <input type="datetime-local" class="form-control" id="tanggal" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jenis</label>
              <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="jenis" id="jMasuk" value="Masuk" checked>
                <label class="btn btn-outline-success" for="jMasuk"><i class="bi bi-arrow-down-circle me-1"></i>Masuk</label>
                <input type="radio" class="btn-check" name="jenis" id="jKeluar" value="Keluar">
                <label class="btn btn-outline-danger" for="jKeluar"><i class="bi bi-arrow-up-circle me-1"></i>Keluar</label>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Nominal (IDR)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="nominal" placeholder="0" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Keterangan</label>
              <textarea class="form-control" id="keterangan" rows="2" placeholder="mis. Transfer BI Fast&#10;Ke BCA - Budi"></textarea>
              <div class="form-text">Gunakan baris baru untuk keterangan bertingkat.</div>
            </div>
            <button type="submit" class="btn btn-brand w-100" id="btnSimpan">
              <i class="bi bi-save me-1"></i>Simpan Transaksi
            </button>
          </form>
        </div>
      </div>

      <!-- Export PDF -->
      <div class="card mb-4">
        <div class="card-header"><i class="bi bi-file-earmark-pdf me-2"></i>Cetak e-Statement (PDF)</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Dari</label>
              <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-6">
              <label class="form-label">Sampai</label>
              <input type="date" class="form-control" id="endDate">
            </div>
          </div>
          <button class="btn btn-brand w-100 mt-3" id="btnPdf">
            <i class="bi bi-download me-1"></i>Cetak e-Statement
          </button>
        </div>
      </div>

      <!-- Pengaturan -->
      <div class="card mb-4">
        <div class="card-header">
          <i class="bi bi-gear me-2"></i>Pengaturan Header &amp; Logo
        </div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-12"><label class="form-label">Nama Entitas (judul header)</label>
              <input class="form-control" id="s_namaEntitas"></div>
            <div class="col-12"><label class="form-label">Alamat / Teks Kanan Header</label>
              <textarea class="form-control" id="s_alamat" rows="2"></textarea></div>
            <div class="col-6"><label class="form-label">Nama Pemilik</label>
              <input class="form-control" id="s_nama"></div>
            <div class="col-6"><label class="form-label">Cabang</label>
              <input class="form-control" id="s_cabang"></div>
            <div class="col-6"><label class="form-label">Jenis Rekening</label>
              <input class="form-control" id="s_jenisRekening"></div>
            <div class="col-6"><label class="form-label">Nomor Rekening</label>
              <input class="form-control" id="s_nomorRekening"></div>
            <div class="col-6"><label class="form-label">Mata Uang</label>
              <input class="form-control" id="s_mataUang"></div>
            <div class="col-6"><label class="form-label">Saldo Awal Akun</label>
              <input type="number" step="0.01" class="form-control" id="s_saldoAwalAkun"></div>

            <div class="col-12"><label class="form-label">Footer Kiri (disclaimer)</label>
              <textarea class="form-control" id="s_footerLeft" rows="2"></textarea>
              <div class="form-text">Tekan Enter untuk baris baru.</div></div>
            <div class="col-12"><label class="form-label">Footer Kanan</label>
              <input class="form-control" id="s_footerRight"></div>

            <div class="col-12 mt-2">
              <label class="form-label">Logo Header</label>
              <div class="d-flex align-items-center gap-3">
                <img id="logoPreview" class="logo-preview" style="display:none;">
                <div class="flex-grow-1">
                  <input type="file" class="form-control form-control-sm" id="logoFile" accept="image/*">
                  <button class="btn btn-sm btn-outline-danger mt-2" id="btnHapusLogo" style="display:none;">
                    <i class="bi bi-trash me-1"></i>Hapus Logo
                  </button>
                </div>
              </div>
            </div>

            <div class="col-12 mt-3">
              <button class="btn btn-brand w-100" id="btnSaveSettings">
                <i class="bi bi-check-lg me-1"></i>Simpan Pengaturan
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- KOLOM KANAN: RIWAYAT -->
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-clock-history me-2"></i>Riwayat Transaksi</span>
          <button class="btn btn-sm btn-outline-secondary" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th>Tanggal</th><th>Keterangan</th>
                  <th class="text-end">Nominal</th><th class="text-end">Saldo</th><th></th>
                </tr>
              </thead>
              <tbody id="trxBody">
                <tr><td colspan="5" class="text-center text-muted py-4">Memuat…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ---------- util ----------
  function toast(msg, ok) {
    var w = document.getElementById('toast-wrap');
    var el = document.createElement('div');
    el.className = 'toast align-items-center text-white border-0 show mb-2 ' + (ok ? 'bg-success' : 'bg-danger');
    el.innerHTML = '<div class="d-flex"><div class="toast-body">' + msg + '</div>' +
      '<button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest(\'.toast\').remove()"></button></div>';
    w.appendChild(el);
    setTimeout(function () { el.remove(); }, 4000);
  }
  function fmtIDR(n) {
    var neg = n < 0; n = Math.abs(Number(n) || 0);
    var p = n.toFixed(2).split('.');
    return (neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1];
  }
  function nowLocalInput() {
    var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  // ---------- init ----------
  document.getElementById('tanggal').value = nowLocalInput();
  (function () {
    var t = new Date(), first = new Date(t.getFullYear(), t.getMonth(), 1);
    document.getElementById('startDate').value = first.toISOString().slice(0, 10);
    document.getElementById('endDate').value = t.toISOString().slice(0, 10);
  })();

  // ---------- transaksi ----------
  document.getElementById('formTrx').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnSimpan');
    btn.disabled = true; btn.innerHTML = 'Menyimpan…';
    var data = {
      tanggal: document.getElementById('tanggal').value,
      jenis: document.querySelector('input[name=jenis]:checked').value,
      nominal: document.getElementById('nominal').value,
      keterangan: document.getElementById('keterangan').value
    };
    google.script.run
      .withSuccessHandler(function () {
        toast('Transaksi tersimpan.', true);
        document.getElementById('nominal').value = '';
        document.getElementById('keterangan').value = '';
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i>Simpan Transaksi';
        loadTrx();
      })
      .withFailureHandler(function (err) {
        toast('Gagal: ' + err.message, false);
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i>Simpan Transaksi';
      })
      .simpanTransaksi(data);
  });

  function loadTrx() {
    google.script.run.withSuccessHandler(function (rows) {
      var tb = document.getElementById('trxBody');
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada transaksi.</td></tr>';
        document.getElementById('saldoNow').textContent = '0,00';
        return;
      }
      document.getElementById('saldoNow').textContent = fmtIDR(rows[0].saldo);
      tb.innerHTML = rows.map(function (r) {
        var out = r.jenis === 'Keluar';
        var nom = (out ? '-' : '+') + r.nominalLabel;
        return '<tr>' +
          '<td><small>' + r.tanggalLabel + '</small></td>' +
          '<td>' + (r.keterangan || '').replace(/\n/g, '<br>') + '</td>' +
          '<td class="text-end ' + (out ? 'amt-out' : 'amt-in') + '">' + nom + '</td>' +
          '<td class="text-end saldo-col">' + r.saldoLabel + '</td>' +
          '<td class="text-end"><button class="btn btn-sm btn-link text-danger p-0" onclick="delTrx(\'' + r.id + '\')"><i class="bi bi-trash"></i></button></td>' +
          '</tr>';
      }).join('');
    }).getTransaksi(200);
  }

  function delTrx(id) {
    if (!confirm('Hapus transaksi ini? Saldo akan dihitung ulang.')) return;
    google.script.run.withSuccessHandler(function () {
      toast('Transaksi dihapus.', true); loadTrx();
    }).hapusTransaksi(id);
  }

  document.getElementById('btnRefresh').addEventListener('click', loadTrx);

  // ---------- export pdf ----------
  document.getElementById('btnPdf').addEventListener('click', function () {
    var btn = this; btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyusun PDF…';
    google.script.run
      .withSuccessHandler(function (res) {
        var bin = atob(res.base64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var blob = new Blob([arr], { type: res.mimeType });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = res.filename; document.body.appendChild(a); a.click();
        a.remove(); URL.revokeObjectURL(url);
        toast('e-Statement berhasil dibuat.', true);
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Cetak e-Statement';
      })
      .withFailureHandler(function (err) {
        toast('Gagal membuat PDF: ' + err.message, false);
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Cetak e-Statement';
      })
      .generatePDFStatement(
        document.getElementById('startDate').value,
        document.getElementById('endDate').value
      );
  });

  // ---------- settings ----------
  function fillSettings(s) {
    ['namaEntitas','alamat','nama','cabang','jenisRekening','nomorRekening','mataUang','saldoAwalAkun','footerLeft','footerRight']
      .forEach(function (k) { var el = document.getElementById('s_' + k); if (el) el.value = s[k] || ''; });
    var prev = document.getElementById('logoPreview');
    var del = document.getElementById('btnHapusLogo');
    if (s.hasLogo) {
      del.style.display = 'inline-block';
      google.script.run.withSuccessHandler(function (uri) {
        if (uri) { prev.src = uri; prev.style.display = 'inline-block'; }
      }).getLogoPreview();
    } else {
      prev.style.display = 'none'; del.style.display = 'none';
    }
  }

  function loadSettings() {
    google.script.run.withSuccessHandler(fillSettings).getSettings();
  }

  document.getElementById('btnSaveSettings').addEventListener('click', function () {
    var obj = {};
    ['namaEntitas','alamat','nama','cabang','jenisRekening','nomorRekening','mataUang','saldoAwalAkun','footerLeft','footerRight']
      .forEach(function (k) { obj[k] = document.getElementById('s_' + k).value; });
    var btn = this; btn.disabled = true;
    google.script.run.withSuccessHandler(function (s) {
      toast('Pengaturan disimpan.', true); fillSettings(s); btn.disabled = false; loadTrx();
    }).withFailureHandler(function (e) {
      toast('Gagal: ' + e.message, false); btn.disabled = false;
    }).saveSettings(obj);
  });

  document.getElementById('logoFile').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('Ukuran logo maksimal 2 MB.', false); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = reader.result.split(',')[1];
      toast('Mengunggah logo…', true);
      google.script.run.withSuccessHandler(function (s) {
        toast('Logo diperbarui.', true); fillSettings(s);
      }).withFailureHandler(function (e) {
        toast('Gagal upload: ' + e.message, false);
      }).uploadLogo(b64, f.type, f.name);
    };
    reader.readAsDataURL(f);
  });

  document.getElementById('btnHapusLogo').addEventListener('click', function () {
    if (!confirm('Hapus logo?')) return;
    google.script.run.withSuccessHandler(fillSettings).hapusLogo();
  });

  // ---------- go ----------
  loadTrx();
  loadSettings();
</script>
</body>
</html>
